# ============================================================
# Industrial Multi-Agent Ecosystem — Docker Compose Orchestration
# ============================================================

services:
  # ── Backend API (FastAPI REST Server + Multi-Agent Pipeline) ─
  backend_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mas_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - OLLAMA_BASE_URL=http://ollama_service:11434
      - BACKEND_URL=http://backend_api:8000
    env_file:
      - .env
    depends_on:
      ollama_service:
        condition: service_healthy
    networks:
      - mas_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Agent 1 (Ingestion Service) ──────────────────────────────
  ingestion_agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: mas_ingestion_agent
    environment:
      - AGENT_TYPE=IngestionAgent
      - BACKEND_URL=http://backend_api:8000
    networks:
      - mas_network
    depends_on:
      - backend_api
    restart: unless-stopped

  # ── Agent 2 (Analysis Service) ────────────────────────────────
  analysis_agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: mas_analysis_agent
    environment:
      - AGENT_TYPE=AnalysisAgent
      - BACKEND_URL=http://backend_api:8000
    networks:
      - mas_network
    depends_on:
      - backend_api
    restart: unless-stopped

  # ── Agent 3 (Report & LLM Service) ────────────────────────────
  report_agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: mas_report_agent
    environment:
      - AGENT_TYPE=ReportAgent
      - OLLAMA_BASE_URL=http://ollama_service:11434
      - BACKEND_URL=http://backend_api:8000
    networks:
      - mas_network
    depends_on:
      - backend_api
    restart: unless-stopped

  # ── Frontend UI (Streamlit Dashboard) ─────────────────────────
  frontend_ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: mas_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - BACKEND_URL=http://backend_api:8000
      - OLLAMA_BASE_URL=http://ollama_service:11434
    depends_on:
      backend_api:
        condition: service_healthy
    networks:
      - mas_network
    restart: unless-stopped

  # ── Ollama Service (Local LLM) ────────────────────────────────
  ollama_service:
    image: ollama/ollama:latest
    container_name: mas_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - mas_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Ollama Model Auto-Pull Helper Service ────────────────────
  ollama_pull:
    image: curlimages/curl:latest
    container_name: mas_ollama_pull
    depends_on:
      ollama_service:
        condition: service_healthy
    networks:
      - mas_network
    entrypoint: >
      /bin/sh -c "
      echo 'Downloading phi3:mini local LLM model...' &&
      curl -X POST http://ollama_service:11434/api/pull -d '{\"name\": \"phi3:mini\"}' &&
      echo 'Ollama phi3:mini model successfully pulled!'
      "
    restart: "no"

  # ── Prometheus (Metrics Scraper) ─────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: mas_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - mas_network
    depends_on:
      - backend_api
    restart: unless-stopped

  # ── Grafana (Observability Dashboard) ─────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: mas_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    networks:
      - mas_network
    depends_on:
      - prometheus
    restart: unless-stopped

# ── Networks ─────────────────────────────────────────────────
networks:
  mas_network:
    driver: bridge
    name: mas_network

# ── Volumes ──────────────────────────────────────────────────
volumes:
  ollama_data:
    name: mas_ollama_models
