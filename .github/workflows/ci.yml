name: CI/CD Pipeline — Industrial Multi-Agent Ecosystem

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check . --ignore E501,F401,E402

      - name: Generate Sample Data for Integration Tests
        run: |
          python data/sample/generate_sample_data.py

      - name: Run Pytest Suite
        run: |
          pytest -v --tb=short

  docker-build:
    name: Docker Build & Compose Config Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Config
        run: |
          docker compose config

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: industrial-mas-backend:latest
